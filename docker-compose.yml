services:
  linki:
    image: linki:local
    build: .
    ports:
      - "127.0.0.1:${PORT:-3456}:3000"
    volumes:
      # Persist SQLite database outside the container
      - ./data:/data
    env_file:
      - .env.local
    environment:
      # Runtime — always set by compose, do not put in .env.local
      - NODE_ENV=production
      - LINKI_DB_PATH=/data/linki.db

      # --- copy the block below into .env.local and fill in values ---
      #
      # Public URL of the app (used by NextAuth for redirects)
      # NEXTAUTH_URL=
      #
      # Random secret for NextAuth session signing
      # Generate with: openssl rand -base64 32
      # NEXTAUTH_SECRET=
      #
      # Password to log in to the Linki UI
      # AUTH_PASSWORD=
      #
      # Set to "false" to show the browser during automation (debug only)
      # HEADLESS=true
      #
      # Bearer token for the review-only MCP endpoint at /api/mcp
      # Generate with: openssl rand -hex 32
      # MCP_API_TOKEN=
      #
      # IDs for the approved account, workflow, paused run, and list
      # MCP_ACCOUNT_ID=
      # MCP_WORKFLOW_ID=
      # MCP_LIST_ID=
      # MCP_WRITES_ENABLED=false

    restart: unless-stopped
